[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upmc-airflow-provider-servicenow"
version = "0.1.0"
description = "Apache Airflow provider for idempotent ServiceNow incident upserts"
requires-python = ">=3.12"
dependencies = [
  "apache-airflow>=3.2.1,<3.3",
  "apache-airflow-providers-http>=6,<7",
  "apache-airflow-providers-standard>=1.12,<2",
]

[project.entry-points.apache_airflow_provider]
provider_info = "upmc_provider_servicenow.get_provider_info:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "requests-mock>=1.12,<2",
  "ruff>=0.7,<1",
]
